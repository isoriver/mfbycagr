name: Refresh fund dataset

# Regenerates src/data/funds-summary.json from MFapi.in daily and commits it,
# which triggers a Vercel production rebuild (ISR pages pick up fresh CAGR).

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC daily (~07:00 IST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build dataset
        run: npm run build:data
        env:
          MF_CONCURRENCY: "8"

      # Supplementary facts (expense ratio + AUM) from AMFI community mirrors. Runs after
      # the dataset so it can key off the same funds; failure here must not fail the job.
      - name: Build fund extras (expense ratio + AUM)
        run: npm run build:extras || echo "build:extras failed; keeping previous fund-extras.json"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/funds-summary.json src/data/fund-extras.json
          if [[ -n "$(git status --porcelain src/data/funds-summary.json src/data/fund-extras.json)" ]]; then
            # NOTE: do NOT add "[skip ci]" here. This workflow only runs on schedule /
            # workflow_dispatch (never on push), so there is no re-trigger loop to guard
            # against — and "[skip ci]" makes Vercel skip the deployment, which is exactly
            # why fresh data never reached the live site. A plain commit lets Vercel
            # rebuild and the homepage/tables pick up the day's NAV & returns.
            git commit -m "chore(data): refresh fund dataset + extras"
            git push
          else
            echo "No data changes."
          fi
