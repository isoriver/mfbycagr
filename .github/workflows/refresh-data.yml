name: Refresh fund dataset

# Regenerates src/data/funds-summary.json from MFapi.in daily and commits it,
# which triggers a Vercel production rebuild (ISR pages pick up fresh CAGR).

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC daily (~07:00 IST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build dataset
        run: npm run build:data
        env:
          MF_CONCURRENCY: "8"

      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain src/data/funds-summary.json)" ]]; then
            git add src/data/funds-summary.json
            git commit -m "chore(data): refresh fund dataset [skip ci]"
            git push
          else
            echo "No dataset changes."
          fi
